<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Ejercicio 12</title>
</head>
<body>


  <form action="#" method="post">

      <legend>Datos personales</legend>

      <label for="usuario">Nombre de usuario:</label>
      <input type="text" id="usuario" name="usuario" placeholder="Ej: juan_perez" required>
      <label for="password">Contraseña:</label>
      <input type="password" id="password" name="password" placeholder="Mínimo 8 caracteres" required>
      <label for="edad">Edad:</label>
      <input type="number" id="edad" name="edad" min="1" max="120" placeholder="Ej: 25">

      <legend>Género</legend>
      <div class="inline-group">
        <label><input type="radio" name="genero" value="masculino"> Masculino</label>
        <label><input type="radio" name="genero" value="femenino"> Femenino</label>
        <label><input type="radio" name="genero" value="otro"> Otro</label>
      </div>

      <legend>Intereses</legend>
      <div class="inline-group">
        <label><input type="checkbox" name="intereses" value="programacion"> Programación</label>
        <label><input type="checkbox" name="intereses" value="diseno"> Diseño</label>
        <label><input type="checkbox" name="intereses" value="Futbol"> Futbol</label>
        <label><input type="checkbox" name="intereses" value="redes"> Redes</label>
      </div>

      <legend>Nivel de experiencia</legend>
      <label for="nivel">Selecciona tu nivel:</label>
      <select id="nivel" name="nivel">
        <option value="">Elegí una opción</option>
        <option value="principiante">Principiante</option>
        <option value="intermedio">Intermedio</option>
        <option value="avanzado">Avanzado</option>
      </select>

    <button type="submit">Enviar</button>

  </form>

</body>
</html>
